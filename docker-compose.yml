services:
  ps5-rom-sync:
    image: ghcr.io/thatretireddude/ps5-rom-sync:latest
    # build: .   # uncomment to build from source instead
    container_name: ps5-rom-sync
    ports:
      - "8585:8585"
    volumes:
      - ./config:/config
      # Point this at your ROM library. Read-only is fine; nothing is written here.
      - /path/to/your/roms:/roms:ro
    environment:
      - TZ=America/New_York
      # Optional: pre-fill the PS5 address (you can also set it in the web UI)
      # - PS5_HOST=192.168.1.50
      # - PS5_FTP_PORT=2121
    restart: unless-stopped
